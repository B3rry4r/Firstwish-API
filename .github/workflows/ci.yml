name: ci

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: firstwish
          POSTGRES_PASSWORD: firstwish
          POSTGRES_DB: firstwish
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U firstwish"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://firstwish:firstwish@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      TEST_DB_PREFIX: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Gates
        run: bash scripts/gates.sh
      - name: Migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://firstwish:firstwish@localhost:5432/firstwish
      - name: Test (full suite)
        run: npm test
