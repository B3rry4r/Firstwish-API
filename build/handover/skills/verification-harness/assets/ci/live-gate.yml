name: Live gate

# The only check in this repository that proves the app talks to a real
# backend, not a mock.
#
# Everything else in CI -- gates, unit tests, a render/screenshot harness --
# runs against a mock/fixture adapter that answers whatever shape the calling
# code asks for. A mock has answered *plausibly wrong* for a shape it did not
# recognise in real projects, passing every test while rendering a
# mislabelled value. That class of defect is structurally invisible to a
# self-consistent suite; this workflow is the only thing that can see it.
#
# Definition of done, strongest tier (see SKILL.md):
#   "The screen renders with real data from a real backend, reached through
#    the real login flow, and a value that exists *only* on the server is
#    visible."
#
# WHO RUNS THIS: CI, against a seeded NON-production environment, and the lead
# for a read-only live check after deploy (a GET, a page render, never a
# payment). An agent building or verifying a task never points this at a payment
# or identity provider, production or a real account; it uses the provider's
# sandbox or the repo's stand-ins and reports anything it could not run as "NOT
# RUN against the real provider: why".
#
# This file is the FLUTTER flavor -- `flutter drive` against a web-server
# target driven by chromedriver. For React/Next (Playwright against a real
# deployment) or a plain HTTP API (a Python/Node script hitting real
# endpoints), see references/per-stack.md and swap the "Run the live gate"
# step for that stack's driver; the surrounding shape (reachability check,
# concurrency group, screenshot upload) still applies.
#
# It could not be run inside a container with no display and a tight
# process-count cgroup -- Chrome's sandbox needs both. GitHub-hosted runners
# have both, so this is its home; adjust if you self-host.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Backend base URL to test against'
        required: false
        default: 'https://staging.example.com'
      target:
        description: 'Where to run it'
        required: false
        default: 'web'
        type: choice
        options: [web, android]
  schedule:
    # A gate that only runs when someone remembers is a gate that stops
    # running -- an earlier end-to-end driver in this project's history ran
    # exactly once, from a scratchpad, and 120 commits later nobody noticed
    # it was gone. Pick a cadence and keep it on a schedule trigger.
    - cron: '0 6 * * *'
  push:
    branches: [ main ]

concurrency:
  # Two runs against one seeded account fight over the same rows.
  group: live-gate-${{ github.ref }}
  cancel-in-progress: false

# Seeded demo accounts on a non-production test environment. Not secrets by
# design if your seeder prints them and the environment is clearly marked
# test/simulated data to anyone who reaches it -- making them secrets only
# obscures which account a failing run used. If your test environment is not
# that isolated, use repository secrets instead.
env:
  LIVE_GATE_EMAIL: ${{ vars.LIVE_GATE_EMAIL }}
  LIVE_GATE_PASSWORD: ${{ secrets.LIVE_GATE_PASSWORD }}
  LIVE_GATE_FRESH_EMAIL: ${{ vars.LIVE_GATE_FRESH_EMAIL }}
  LIVE_GATE_FRESH_PASSWORD: ${{ secrets.LIVE_GATE_FRESH_PASSWORD }}

jobs:
  web:
    name: Live gate (Chrome)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install matching chromedriver
        run: |
          set -euo pipefail
          CHROME_VERSION="$(google-chrome --version | grep -oE '[0-9]+' | head -1)"
          echo "Chrome major: $CHROME_VERSION"
          npx --yes @puppeteer/browsers install "chromedriver@$CHROME_VERSION" --path "$RUNNER_TEMP/cd"
          DRIVER="$(find "$RUNNER_TEMP/cd" -name chromedriver -type f | head -1)"
          chmod +x "$DRIVER"
          echo "$(dirname "$DRIVER")" >> "$GITHUB_PATH"
          "$DRIVER" --version

      - run: flutter pub get

      - name: Confirm the backend is reachable before blaming the app
        env:
          BASE_URL: ${{ inputs.base_url || vars.LIVE_GATE_BASE_URL }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/health" || echo 000)"
          echo "GET $BASE_URL/health -> $code"
          # 401/403 counts as reachable: the route resolved and its guard ran.
          # Adjust the path/codes to whatever your backend's cheapest
          # unauthenticated (or guard-protected) route is.
          case "$code" in
            2*|401|403) echo "backend reachable" ;;
            *) echo "::error::Backend unreachable ($code). The gate cannot attribute a failure to the app."; exit 1 ;;
          esac

      - name: Run the live gate
        env:
          BASE_URL: ${{ inputs.base_url || vars.LIVE_GATE_BASE_URL }}
        run: |
          set -euo pipefail
          chromedriver --port=4444 &
          for _ in $(seq 1 20); do curl -sf http://localhost:4444/status >/dev/null && break; sleep 1; done
          # -d web-server, NOT -d chrome. `-d chrome` launches a HEADED
          # browser via Flutter's ChromeDevice -- on a runner with no display
          # nothing ever connects back to the debug service and the job
          # hangs until the timeout. `-d web-server --browser-name=chrome`
          # drives it through WebDriver instead, which honours --headless.
          # --browser-dimension defaults to 1600x1024 (a desktop shape) --
          # set it to your target device's shape, e.g. a phone.
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/live_gate_test.dart \
            -d web-server \
            --browser-name=chrome \
            --headless \
            --browser-dimension=430x932 \
            --dart-define=API_BASE_URL="$BASE_URL" \
            --dart-define=LIVE_GATE_EMAIL="${{ env.LIVE_GATE_EMAIL }}" \
            --dart-define=LIVE_GATE_PASSWORD="${{ env.LIVE_GATE_PASSWORD }}" \
            --dart-define=LIVE_GATE_FRESH_EMAIL="${{ env.LIVE_GATE_FRESH_EMAIL }}" \
            --dart-define=LIVE_GATE_FRESH_PASSWORD="${{ env.LIVE_GATE_FRESH_PASSWORD }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gate-screenshots
          # Wherever your driver test writes captures. Getting this path
          # wrong is a silent failure mode: the run stays green, the images
          # are produced and then discarded, and the one thing a human needs
          # (screenshots -- automated assertions catch crashes and emptiness,
          # only a person scrolling images catches wrongness) never surfaces.
          path: build/live_gate_screenshots/**
          if-no-files-found: warn
          retention-days: 30

  android:
    name: Live gate (Android emulator)
    # Opt-in: slower, but it exercises the artifact users actually install
    # rather than a web build of the same code. Release-build-only defects
    # (missing platform permissions, release-mode network config) are
    # invisible to the web job above by construction.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Enable KVM for a usable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the live gate on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/live_gate_test.dart \
              --dart-define=API_BASE_URL="${{ inputs.base_url || vars.LIVE_GATE_BASE_URL }}" \
              --dart-define=LIVE_GATE_EMAIL="${{ env.LIVE_GATE_EMAIL }}" \
              --dart-define=LIVE_GATE_PASSWORD="${{ env.LIVE_GATE_PASSWORD }}" \
              --dart-define=LIVE_GATE_FRESH_EMAIL="${{ env.LIVE_GATE_FRESH_EMAIL }}" \
              --dart-define=LIVE_GATE_FRESH_PASSWORD="${{ env.LIVE_GATE_FRESH_PASSWORD }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gate-screenshots-android
          path: build/live_gate_screenshots/**
          if-no-files-found: warn
          retention-days: 30
